services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friendbook-v3
    ports:
      - "127.0.0.1:1004:80"
    image: php:8.3-apache
    volumes:
      - ./app:/var/www/app
      - ./public:/var/www/html
    networks:
      - friendbook_v3
      - proxy-network
    depends_on:
      - db

  db:
    container_name: friendbook-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./files/db/friendbook_v3.sql:/docker-entrypoint-initdb.d/friendbook_v3.sql:ro
    networks:
      - friendbook_v3

networks:
  friendbook_v3:
    driver: bridge

  proxy-network:
    external: true

volumes:
  mysql_data:
